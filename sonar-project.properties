sonar.projectKey=fleXRPL_signal
sonar.organization=flexrpl

sonar.projectName=Signal — Political Intelligence Pipeline
sonar.projectVersion=1.0

# Source and test paths
sonar.sources=pipeline,main.py
sonar.tests=tests
sonar.python.version=3.11

# Coverage report — generated by pytest-cov in ci.yml
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions — generated files and vendored deps
sonar.exclusions=reports/**,htmlcov/**,images/**,docs/**
sonar.coverage.exclusions=tests/**,main.py
